<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login | Pretheweish</title>

<style>
body {
  background:#050d1a;
  margin:0;
  font-family:Arial, sans-serif;
  color:#d5eaff;
}

/* Floating Login Button */
.login-btn{
  position:fixed;
  top:45%;
  left:20px;
  background:#00eaff;
  padding:14px 30px;
  border-radius:14px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px #00eaff;
}
.login-btn:hover{
  transform:scale(1.1);
}

/* Modal */
dialog{
  width:430px;
  border:none;
  border-radius:16px;
  background:rgba(0,30,60,.4);
  backdrop-filter:blur(20px);
  box-shadow:0 0 30px #00eaff88;
}
dialog::backdrop{
  background:rgba(0,0,0,.65);
}

.card{ padding:30px; }

/* Tabs */
.tabs{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}
.tabs button{
  flex:1;
  background:none;
  border:none;
  color:#7fdfff;
  padding:10px;
  font-size:16px;
  cursor:pointer;
}
.tabs button.active{
  color:#00eaff;
  border-bottom:2px solid #00eaff;
}

h2{
  text-align:center;
  color:#00eaff;
  margin-bottom:20px;
}

/* Inputs */
input{
  width:90%;
  padding:12px;
  margin:10px auto;
  display:block;
  background:#0d1f33;
  border:1px solid #00eaff55;
  border-radius:10px;
  color:#e6f8ff;
}
input:focus{
  outline:none;
  box-shadow:0 0 15px #00eaff;
}

/* Buttons */
.btn-row{
  display:flex;
  margin-top:20px;
}
.btn-row button{
  flex:1;
  margin:0 5px;
  padding:12px;
  background:#00eaff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.btn-row button:hover{
  box-shadow:0 0 20px #00eaff;
}

/* Messages */
.msg{
  text-align:center;
  margin-top:15px;
  color:#ff5c8a;
}
</style>
</head>

<body>

<div class="login-btn" onclick="authModal.showModal()">Login</div>

<!-- MAIN AUTH MODAL -->
<dialog id="authModal">
  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <button id="userTab" class="active" onclick="switchTab('user')">User</button>
      <button id="adminTab" onclick="switchTab('admin')">Admin</button>
    </div>

    <!-- USER LOGIN -->
    <div id="userLogin">
      <h2>User Login</h2>
      <input type="email" id="userEmail" placeholder="Email">
      <input type="password" id="userPass" placeholder="Password">
      <div class="btn-row">
        <button onclick="userLogin()">Login</button>
        <button onclick="authModal.close()">Close</button>
      </div>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="adminLogin" style="display:none;">
      <h2>Admin Login</h2>
      <input type="email" id="adminEmail" placeholder="Admin Email">
      <input type="password" id="adminPass" placeholder="Admin Password">
      <div class="btn-row">
        <button onclick="adminLogin()">Login</button>
        <button onclick="authModal.close()">Close</button>
      </div>
    </div>

    <p id="authMsg" class="msg"></p>

  </div>
</dialog>

<dialog id="mobileModal">
  <div class="card">
    <h2>Verify Mobile</h2>

    <input type="tel" id="mobile" placeholder="Mobile Number">
    <input type="text" id="otp" placeholder="Enter OTP">

    <div class="btn-row">
      <button id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
      <button onclick="verifyOTP()">Verify</button>
    </div>

    <p id="timerText" style="text-align:center;color:#7fdfff;"></p>
    <p id="otpMsg" class="msg"></p>
  </div>
</dialog>

<script>
function switchTab(tab){
  userTab.classList.remove("active");
  adminTab.classList.remove("active");
  userLogin.style.display="none";
  adminLogin.style.display="none";

  if(tab==="user"){
    userTab.classList.add("active");
    userLogin.style.display="block";
  }else{
    adminTab.classList.add("active");
    adminLogin.style.display="block";
  }
}

/* USER LOGIN */
function userLogin(){
  authMsg.innerText="Checking credentials...";
  setTimeout(()=>{
    authModal.close();
    mobileModal.showModal(); // Option B
  },1000);
}

/* ADMIN LOGIN */
function adminLogin(){
  authMsg.innerText="Admin login successful!";
}

/* OTP LOGIC */
let timer;
let timeLeft = 60;

function sendOTP() {
  const mobile = mobile.value;
  if (!mobile) {
    otpMsg.innerText = "Please enter mobile number";
    return;
  }

  otpMsg.innerText = "OTP sent successfully";
  startTimer();
  // Backend OTP API call
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 60;
  sendOtpBtn.disabled = true;
  sendOtpBtn.style.opacity = "0.5";
  sendOtpBtn.innerText = "Send OTP";

  timerText.innerText = `Resend OTP in ${timeLeft}s`;

  timer = setInterval(() => {
    timeLeft--;
    timerText.innerText = `Resend OTP in ${timeLeft}s`;

    if (timeLeft <= 0) {
      clearInterval(timer);
      timerText.innerText = "You can resend OTP now";
      sendOtpBtn.disabled = false;
      sendOtpBtn.style.opacity = "1";
      sendOtpBtn.innerText = "Resend OTP";
    }
  }, 1000);
}

function verifyOTP() {
  const otp = otp.value;
  if (!otp) {
    otpMsg.innerText = "Please enter OTP";
    return;
  }

  otpMsg.innerText = "Mobile verified successfully!";
  setTimeout(() => {
    mobileModal.close();
  }, 1000);
}
</script>

</body>
</html>
