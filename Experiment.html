<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laboratory Experiment Record</title>

<!-- ================== CSS ================== -->
<style>
body {
  background: #0a0f1f;
  color: #eaeaea;
  font-family: Arial, sans-serif;
  padding: 30px;
}

/* TITLE */
h1 {
  text-align: center;
  color: #00ffd5;
  margin-bottom: 20px;
}

h2 {
  color: #ffe600;
  margin-top: 30px;
}

/* SEARCH */
#searchInput {
  width: 100%;
  padding: 10px;
  margin-bottom: 20px;
  font-size: 16px;
}

/* FORM */
form {
  background: #112240;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 30px;
}

form input,
form textarea {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  margin-bottom: 12px;
  background: #0a0f1f;
  color: #eaeaea;
  border: 1px solid #00ffd5;
}

form textarea {
  height: 70px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #00ffd5;
  padding: 10px;
  vertical-align: top;
}

th {
  background: #112240;
  color: #ff0000;
}

tr:nth-child(even) {
  background: #0f1a35;
}

tr:hover {
  background: rgba(0,255,213,0.1);
}

/* IMAGE */
.preview {
  width: 120px;
  border-radius: 6px;
}

/* BUTTONS */
button {
  padding: 8px 14px;
  margin: 10px 5px;
  background: #00ffd5;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #00c0a0;
}

/* PRINT MODE */
@media print {
  body {
    background: white;
    color: black;
  }
  button, #searchInput, #csvInput, form {
    display: none;
  }
}
</style>
</head>

<body>

<!-- ================== TITLE ================== -->
<h1>🧪 Laboratory Experiment Record</h1>

<!-- ================== ADD EXPERIMENT FORM ================== -->
<h2>➕ Add New Experiment</h2>

<form id="experimentForm">
  <input type="text" placeholder="Experiment Name" required>

  <textarea placeholder="Parameters Taken" required></textarea>

  <textarea placeholder="Properties / Important Facts"></textarea>

  <textarea placeholder="Result"></textarea>

  <input type="text" placeholder="Image / Graph Path (files/image.png)">

  <input type="text" placeholder="File Link (files/report.pdf)">

  <textarea placeholder="Conclusion"></textarea>

  <button type="submit">➕ Add Experiment</button>
</form>

<hr>

<!-- ================== SEARCH & ACTIONS ================== -->
<input type="text" id="searchInput" placeholder="🔍 Search experiment..." onkeyup="searchExperiment()">

<input type="file" id="csvInput" accept=".csv" onchange="importCSV()">

<button onclick="window.print()">🖨️ Print Report</button>

<!-- ================== TABLE ================== -->
<table id="experimentTable">
<thead>
<tr>
  <th>No.</th>
  <th>Experiment Name</th>
  <th>Parameters Taken</th>
  <th>Properties / Important Facts</th>
  <th>Result</th>
  <th>Graph / Image</th>
  <th>File Link</th>
  <th>Conclusion</th>
</tr>
</thead>

<tbody>
<tr>
  <td></td>
  <td>CVD</td>
  <td>none</td>
  <td>None</td>
  <td>None</td>
  <td><img src="files/hall_graph.png" class="preview"></td>
  <td><a href="assets/pdf/06.01.26.pdf">PDF</a></td>
  <td>None </td>
</tr>
</tbody>
</table>

<!-- ================== JAVASCRIPT ================== -->
<script>

/* AUTO NUMBERING */
function autoNumber() {
  const rows = document.querySelectorAll("#experimentTable tbody tr");
  rows.forEach((row, index) => {
    row.cells[0].innerText = index + 1;
  });
}
autoNumber();

/* SEARCH FUNCTION */
function searchExperiment() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#experimentTable tbody tr");

  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

/* CSV IMPORT */
function importCSV() {
  const file = document.getElementById("csvInput").files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split("\n");
    const tbody = document.querySelector("#experimentTable tbody");
    tbody.innerHTML = "";

    lines.forEach(line => {
      const cols = line.split(",");
      if (cols.length >= 6) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td></td>
          <td>${cols[0]}</td>
          <td>${cols[1]}</td>
          <td>${cols[2]}</td>
          <td>${cols[3]}</td>
          <td>${cols[4]}</td>
          <td>${cols[5]}</td>
          <td>${cols[6] || ""}</td>
        `;
        tbody.appendChild(row);
      }
    });
    autoNumber();
  };
  reader.readAsText(file);
}

/* ADD EXPERIMENT FORM */
document.getElementById("experimentForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const inputs = this.querySelectorAll("input, textarea");
  const table = document.querySelector("#experimentTable tbody");
  const row = document.createElement("tr");

  const img = inputs[4].value
    ? `<img src="${inputs[4].value}" class="preview">`
    : "";

  const file = inputs[5].value
    ? `<a href="${inputs[5].value}">File</a>`
    : "";

  row.innerHTML = `
    <td></td>
    <td>${inputs[0].value}</td>
    <td>${inputs[1].value}</td>
    <td>${inputs[2].value}</td>
    <td>${inputs[3].value}</td>
    <td>${img}</td>
    <td>${file}</td>
    <td>${inputs[6].value}</td>
  `;

  table.appendChild(row);
  autoNumber();
  this.reset();
});
</script>

</body>
</html>
