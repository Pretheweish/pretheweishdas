<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Dashboard | Pretheweish</title>

  <style>
    :root{
      --bg:#07131f; --panel:#0b1c2e; --edge:#11324c;
      --text:#e9f7ff; --muted:#97bdd0; --neon:#00eaff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(1200px 700px at 20% -10%, #0c2338 0%, #06111c 55%, #040a12 100%), var(--bg);
      color:var(--text);
      font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{max-width:1100px;margin:auto;padding:20px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .brand{display:flex;gap:10px;align-items:center}
    .pill{padding:6px 10px;border:1px solid var(--edge);border-radius:999px;color:var(--muted);font-size:.85rem}
    .btn{
      padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;
      background:linear-gradient(180deg,var(--neon),#00b8ff);
      box-shadow:0 0 18px rgba(0,234,255,.45);
    }
    .btn.danger{
      background:linear-gradient(180deg,#ff6f9e,#ff497f);
      box-shadow:0 0 18px rgba(255,80,120,.45);
    }
    .panel{
      background:#0a1c2f;
      border:1px solid var(--edge);
      border-radius:14px;
      padding:16px;
      margin-bottom:16px;
    }
    textarea{
      width:100%;height:140px;padding:10px;border-radius:10px;
      background:#07131f;color:white;border:1px solid var(--edge);
      resize:none;
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <h2>Dashboard</h2>
      <div class="pill" id="who">Checking session...</div>
    </div>
    <div>
      <button class="btn" onclick="location.href='add-document.html'">Your Prescriptions</button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Notes -->
  <div class="panel">
    <h3>Important Notes</h3>
    <textarea id="notesBox" placeholder="Write your notes..."></textarea>
    <br><br>
    <button class="btn" onclick="saveNotes()">Save Notes</button>
  </div>

  <!-- Files -->
  <div class="panel">
    <h3>My Files</h3>
    <ul id="fileList"></ul>
    <p id="emptyHint" style="color:#97bdd0;display:none;">No files found</p>
  </div>

  <!-- Upload -->
  <div class="panel">
    <h3>Upload File</h3>
    <input type="file" id="pick">
    <button class="btn" onclick="uploadFile()">Upload</button>
    <p id="status"></p>
  </div>

</div>

<!-- Supabase -->
<script type="module">
import { supa } from "./supabase-config.js";

const SITE_URL = "https://pretheweish.github.io/pretheweishdas/";

// ==========================
// SESSION CHECK (IMPORTANT)
// ==========================
window.addEventListener("load", async () => {
  const { data, error } = await supa.auth.getSession();

  if (!data.session) {
    // Not logged in → go back
    window.location.href = SITE_URL;
    return;
  }

  // Show user email
  document.getElementById("who").innerText =
    data.session.user.email;

  loadFiles();
});


// ==========================
// LOGOUT
// ==========================
window.logout = async function () {
  await supa.auth.signOut();
  window.location.href = SITE_URL;
};


// ==========================
// NOTES (LocalStorage)
// ==========================
const notesBox = document.getElementById("notesBox");
notesBox.value = localStorage.getItem("dashboard_notes") || "";

window.saveNotes = function () {
  localStorage.setItem("dashboard_notes", notesBox.value);
  alert("Notes saved!");
};


// ==========================
// FILE UPLOAD
// ==========================
window.uploadFile = async function () {
  const fileInput = document.getElementById("pick");
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    alert("Select a file first");
    return;
  }

  const file = fileInput.files[0];
  const filePath = Date.now() + "_" + file.name;

  status.innerText = "Uploading...";

  const { error } = await supa.storage
    .from("documents")
    .upload(filePath, file);

  if (error) {
    status.innerText = "Upload failed";
  } else {
    status.innerText = "Uploaded!";
    loadFiles();
  }
};


// ==========================
// LOAD FILES
// ==========================
async function loadFiles() {
  const list = document.getElementById("fileList");
  const empty = document.getElementById("emptyHint");

  list.innerHTML = "";

  const { data, error } = await supa.storage
    .from("documents")
    .list();

  if (!data || data.length === 0) {
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  data.forEach(file => {
    const li = document.createElement("li");
    li.innerHTML = file.name;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
